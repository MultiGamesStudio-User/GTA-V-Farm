name: Test Build (PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'electron-app/package-lock.json'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Cache embedded Python + Tesseract
        uses: actions/cache@v4
        with:
          path: |
            electron-app/python-embed
            tesseract
          key: python-embed-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 📦 Cache Electron + electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-cache-${{ runner.os }}-${{ hashFiles('electron-app/package-lock.json') }}

      - name: 📥 Install Node dependencies
        working-directory: electron-app
        run: npm ci

      - name: 📥 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 🎨 Check icons
        working-directory: electron-app
        run: npm run check-icons
        continue-on-error: true

      - name: 🏗️ Test build (Portable)
        working-directory: electron-app
        run: npm run build-portable
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: ✅ Build test successful!
        run: Write-Host "✓ Build test passed - ready to merge!" -ForegroundColor Green
