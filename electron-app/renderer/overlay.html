<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>MacroEngine Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      rgba(9,9,15,0.97);
      --b:       rgba(255,255,255,.07);
      --b2:      rgba(255,255,255,.12);
      --green:   #3ddc84;
      --red:     #ff4a4a;
      --orange:  #ff9500;
      --blue:    #4a9eff;
      --purple:  #a78bfa;
      --t:       #d0d0e0;
      --t2:      rgba(160,160,200,.4);
      --t3:      rgba(100,100,140,.28);
      --r:       9px;
      --f:       'Segoe UI', system-ui, sans-serif;
      --m:       'Consolas', monospace;
    }

    html, body {
      height: 100%; background: transparent;
      font-family: var(--f); overflow: hidden; user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      display: flex; flex-direction: column; height: 100%;
      background: var(--bg);
      border: 1px solid var(--b2);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.92), 0 0 0 1px rgba(255,255,255,.03) inset;
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
    }

    /* ── animations ── */
    @keyframes pg {
      0%,100% { box-shadow: 0 0 0 0 rgba(61,220,132,.55); }
      60%      { box-shadow: 0 0 0 5px rgba(61,220,132,0); }
    }
    @keyframes po {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,149,0,.55); }
      60%      { box-shadow: 0 0 0 5px rgba(255,149,0,0); }
    }

    /* ── titlebar ── */
    #tb {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 7px 6px 10px;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--b);
      background: rgba(255,255,255,.015);
      flex-shrink: 0;
    }
    #tb-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--t3); flex-shrink: 0; transition: background .3s;
    }
    #tb-dot.on { background: var(--green); animation: pg 2.5s ease-in-out infinite; }
    #tb-label {
      font-size: 8.5px; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: var(--t2); flex: 1;
    }
    #tb-count {
      font-size: 8px; font-weight: 700; font-family: var(--m);
      color: var(--green); background: rgba(61,220,132,.1);
      border: 1px solid rgba(61,220,132,.16); border-radius: 3px;
      padding: 1px 5px; display: none;
    }
    #tb-count.on { display: inline; }
    .tbb {
      display: flex; gap: 2px; -webkit-app-region: no-drag;
    }
    .tb-btn {
      width: 18px; height: 18px; border-radius: 4px; border: none;
      background: transparent; color: var(--t3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .1s, color .1s; padding: 0;
    }
    .tb-btn:hover                { background: rgba(255,255,255,.07); color: var(--t2); }
    .tb-btn.c-col:hover          { background: rgba(167,139,250,.12); color: var(--purple); }
    .tb-btn.c-close:hover        { background: rgba(255,74,74,.2);    color: var(--red); }

    /* ── kill bar ── */
    #kill {
      display: flex; gap: 4px; padding: 5px 7px;
      border-bottom: 1px solid var(--b); flex-shrink: 0;
    }
    .kk {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 4px 6px; border-radius: 6px; border: none; cursor: pointer;
      font-family: var(--f); transition: filter .1s, transform .07s;
      background: rgba(255,74,74,.09); border: 1px solid rgba(255,74,74,.13);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .kk.kp { background: rgba(255,149,0,.08); border-color: rgba(255,149,0,.12); }
    .kk:hover  { filter: brightness(1.3); }
    .kk:active { transform: translateY(1px); filter: brightness(.95); }

    .kk-key {
      font-size: 8px; font-weight: 800; font-family: var(--m);
      color: var(--red); background: rgba(255,74,74,.1);
      border: 1px solid rgba(255,74,74,.18); border-radius: 3px;
      padding: 0 4px; line-height: 14px;
      box-shadow: 0 1px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .kk.kp .kk-key { color: var(--orange); background: rgba(255,149,0,.09); border-color: rgba(255,149,0,.17); }
    .kk-lbl { font-size: 9px; font-weight: 600; color: rgba(255,110,110,.65); }
    .kk.kp .kk-lbl { color: rgba(255,170,60,.65); }

    /* ── expandable ── */
    #body { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* ── macro list ── */
    #mlist {
      flex: 1; overflow-y: auto; padding: 3px 6px 4px;
      display: flex; flex-direction: column; gap: 2px; min-height: 0;
    }
    .empty { padding: 14px 10px; font-size: 10px; color: var(--t3); text-align: center; }

    .mr {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 7px 5px 8px; border-radius: 6px;
      border: 1px solid transparent; transition: background .12s;
    }
    .mr.i { background: rgba(255,255,255,.02); border-color: rgba(255,255,255,.04); }
    .mr.i:hover { background: rgba(255,255,255,.04); }
    .mr.r {
      background: rgba(61,220,132,.055);
      border-color: rgba(61,220,132,.13);
      box-shadow: inset 2px 0 0 rgba(61,220,132,.35);
    }
    .mr.r:hover { background: rgba(61,220,132,.085); }

    .md { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .mr.i .md { background: var(--t3); }
    .mr.r .md { background: var(--green); animation: pg 2.5s ease-in-out infinite; }

    .mn {
      flex: 1; font-size: 10.5px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mr.i .mn { color: rgba(180,180,210,.45); }
    .mr.r .mn { color: var(--t); }

    .mt {
      font-size: 9px; color: var(--green); font-weight: 600;
      font-family: var(--m); opacity: .75; flex-shrink: 0;
      font-variant-numeric: tabular-nums; min-width: 34px; text-align: right;
    }

    .mb {
      width: 20px; height: 20px; border-radius: 4px; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; padding: 0; transition: background .1s, transform .07s;
    }
    .mb:active { transform: scale(.86); }
    .mr.i .mb { background: rgba(61,220,132,.08); color: rgba(61,220,132,.75); }
    .mr.i .mb:hover { background: rgba(61,220,132,.2); }
    .mr.r .mb { background: rgba(255,74,74,.09); color: rgba(255,100,100,.8); }
    .mr.r .mb:hover { background: rgba(255,74,74,.2); }

    /* ── ACP section ── */
    #acp {
      flex-shrink: 0; border-top: 1px solid var(--b);
      padding: 5px 7px 6px;
    }
    #acp-row1 {
      display: flex; align-items: center; gap: 5px; margin-bottom: 5px;
    }
    .ad {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--t3); flex-shrink: 0; transition: background .3s;
    }
    .ad.on { background: var(--orange); animation: po 2.5s ease-in-out infinite; }
    #acp-title {
      font-size: 8px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: var(--t3); flex: 1;
    }
    #acp-info { font-size: 8.5px; color: var(--t3); font-family: var(--m); }

    #acp-hks {
      display: flex; gap: 4px; margin-bottom: 5px;
    }
    .ahk {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 3px;
      padding: 3px 5px; border-radius: 4px;
      background: rgba(255,255,255,.02); border: 1px solid rgba(255,149,0,.07);
    }
    .ahk-k {
      font-size: 7.5px; font-weight: 800; font-family: var(--m);
      color: var(--orange); background: rgba(255,149,0,.09);
      border: 1px solid rgba(255,149,0,.16); border-radius: 2px;
      padding: 0 3px; line-height: 13px;
      box-shadow: 0 1px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .ahk-l { font-size: 8px; color: rgba(255,165,50,.55); font-weight: 500; }

    #acp-cd {
      display: none; text-align: center; font-size: 11px; font-weight: 800;
      font-family: var(--m); color: var(--orange); padding: 1px 0 4px;
      letter-spacing: .03em;
    }
    #acp-cd.on { display: block; }

    #acp-btn {
      width: 100%; padding: 5px 8px; border-radius: 5px;
      border: 1px solid rgba(255,149,0,.18);
      background: rgba(255,149,0,.07);
      color: var(--orange); font-size: 9.5px; font-weight: 700;
      cursor: pointer; letter-spacing: .05em; text-transform: uppercase;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      font-family: var(--f); transition: background .1s, transform .07s;
    }
    #acp-btn:hover  { background: rgba(255,149,0,.16); }
    #acp-btn:active { transform: scale(.99); }
    #acp-btn.s { border-color: rgba(255,74,74,.2); background: rgba(255,74,74,.08); color: var(--red); }
    #acp-btn.s:hover { background: rgba(255,74,74,.18); }
    #acp-btn.cancel { border-color: rgba(255,149,0,.25); background: rgba(255,149,0,.12); }

    /* ── footer ── */
    #foot { padding: 4px 6px 6px; border-top: 1px solid var(--b); flex-shrink: 0; }
    #btn-stop {
      width: 100%; padding: 6px 8px; border-radius: 6px;
      background: rgba(255,74,74,.09); border: 1px solid rgba(255,74,74,.18);
      color: var(--red); font-size: 10px; font-weight: 700;
      cursor: pointer; letter-spacing: .05em; text-transform: uppercase;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      font-family: var(--f); transition: background .1s, transform .07s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    }
    #btn-stop:hover  { background: rgba(255,74,74,.18); }
    #btn-stop:active { transform: scale(.99); }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.07); border-radius: 1px; }

    /* ── collapsed ── */
    #root.col #body, #root.col #foot { display: none; }
  </style>
</head>
<body>
<div id="root">

  <!-- Titlebar -->
  <div id="tb">
    <div id="tb-dot"></div>
    <span id="tb-label">Macro Engine</span>
    <span id="tb-count"></span>
    <div class="tbb">
      <button class="tb-btn" onclick="window.overlay.focusMain()" title="Ouvrir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" width="10">
          <rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M9 12h6M12 9v6"/>
        </svg>
      </button>
      <button class="tb-btn c-col" id="btn-col" onclick="toggleCol()" title="Réduire">
        <svg id="ico-col" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="10">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <button class="tb-btn" onclick="window.overlay.hide()" title="Masquer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="10">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button class="tb-btn c-close" onclick="window.overlay.close()" title="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="10">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Kill bar -->
  <div id="kill">
    <button class="kk" onclick="doStop()" title="Tout arrêter">
      <span class="kk-key" id="k-stop">F12</span>
      <span class="kk-lbl">Stop tout</span>
    </button>
    <button class="kk kp" onclick="doPause()" title="Pause / Reprendre">
      <span class="kk-key" id="k-pause">F11</span>
      <span class="kk-lbl" id="k-pause-lbl">Pause</span>
    </button>
  </div>

  <!-- Body -->
  <div id="body">
    <div id="mlist"><div class="empty">Chargement…</div></div>

    <div id="acp">
      <div id="acp-row1">
        <div class="ad" id="acp-dot"></div>
        <span id="acp-title">Auto Clicker</span>
        <span id="acp-info">—</span>
      </div>
      <div id="acp-hks">
        <div class="ahk">
          <span class="ahk-k" id="ahk-s">F6</span><span class="ahk-l">Start</span>
        </div>
        <div class="ahk">
          <span class="ahk-k" id="ahk-e">F7</span><span class="ahk-l">Stop</span>
        </div>
      </div>
      <div id="acp-cd"></div>
      <button id="acp-btn" onclick="acpToggle()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="9"><polygon points="5,3 19,12 5,21"/></svg>
        Démarrer
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div id="foot">
    <button id="btn-stop" onclick="doStop()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="10"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      Tout arrêter
    </button>
  </div>

</div>
<script>
'use strict';

const R_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor" width="10"><polygon points="5,3 19,12 5,21"/></svg>`;
const R_STOP = `<svg viewBox="0 0 24 24" fill="currentColor" width="10"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>`;

const allM   = [];
const run    = new Map();
const logs   = [];

let _acpOn   = false;
let _acpCfg  = null;
let _cdTimer = null;
let _paused  = false;
let _col     = localStorage.getItem('ov-c') === '1';

const COL_H  = 66;
const EXP_H  = 300;

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(ms) {
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  return h>0 ? `${h}h${String(m%60).padStart(2,'0')}m` : `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

/* ── collapse ── */
function applyCol() {
  document.getElementById('root').classList.toggle('col', _col);
  document.getElementById('ico-col').innerHTML = _col
    ? '<polyline points="6 9 12 15 18 9"/>'
    : '<polyline points="18 15 12 9 6 15"/>';
  const h = _col ? COL_H : (parseInt(localStorage.getItem('ov-eh')) || EXP_H);
  window.overlay.setSize(280, h);
  localStorage.setItem('ov-c', _col ? '1' : '0');
}
function toggleCol() {
  if (!_col) localStorage.setItem('ov-eh', String(window.outerHeight || EXP_H));
  _col = !_col;
  applyCol();
}

/* ── stop / pause ── */
function doStop() {
  window.overlay.stopAll();
  _paused = false; updPause();
}
function doPause() {
  window.overlay.pauseAll();
  _paused = !_paused; updPause();
}
function updPause() {
  document.getElementById('k-pause-lbl').textContent = _paused ? 'Reprendre' : 'Pause';
}

/* ── macros ── */
function renderMacros() {
  const n = run.size;
  const dot = document.getElementById('tb-dot');
  const cnt = document.getElementById('tb-count');
  dot.classList.toggle('on', n > 0);
  cnt.textContent = n; cnt.classList.toggle('on', n > 0);

  const el = document.getElementById('mlist');
  if (!allM.length) { el.innerHTML = '<div class="empty">Aucune macro</div>'; return; }

  el.innerHTML = allM.map(name => {
    const on  = run.has(name);
    const st  = run.get(name);
    const act = on
      ? `window.overlay.macroStop(${JSON.stringify(name)})`
      : `window.overlay.macroStart(${JSON.stringify(name)})`;
    return `<div class="mr ${on?'r':'i'}">
      <div class="md"></div>
      <div class="mn" title="${esc(name)}">${esc(name)}</div>
      ${on ? `<div class="mt" data-s="${st}">${fmt(Date.now()-st)}</div>` : ''}
      <button class="mb" onclick="${act}">${on?R_STOP:R_PLAY}</button>
    </div>`;
  }).join('');
}

setInterval(() => {
  document.querySelectorAll('.mt[data-s]').forEach(el => {
    el.textContent = fmt(Date.now() - +el.dataset.s);
  });
}, 1000);

async function loadMacros() {
  try { const r = await window.overlay.getMacros(); allM.length=0; if(r?.macros) allM.push(...r.macros); } catch(_){}
  renderMacros();
}

/* ── shortcuts ── */
async function loadShortcuts() {
  try {
    const r = await window.overlay.getShortcuts();
    if (r?.ok) {
      if (r.stop)  document.getElementById('k-stop').textContent  = r.stop;
      if (r.pause) document.getElementById('k-pause').textContent = r.pause;
    }
  } catch(_){}
}

/* ── events ── */
window.overlay.onStatus(d => {
  const rs = new Set(d.running||[]);
  const acpNow = rs.has('__auto_clicker__');
  if (acpNow !== _acpOn) setAcpOn(acpNow);
  for (const n of [...run.keys()]) if (!rs.has(n)) run.delete(n);
  for (const n of rs) {
    if (n==='__auto_clicker__') continue;
    if (!run.has(n)) run.set(n, Date.now());
    if (!allM.includes(n)) allM.push(n);
  }
  _paused=false; updPause(); renderMacros();
});

window.overlay.onStopped(() => { run.clear(); _paused=false; updPause(); setAcpOn(false); renderMacros(); });
window.overlay.onMacrosUpdated(() => loadMacros());
window.overlay.onAcpStatus(d => { if (!d.running && _cdTimer) clearCd(); setAcpOn(!!d.running); });

/* ── ACP ── */
function acpSum(c) {
  if (!c) return '—';
  const h=+c['acp-h']||0, m=+c['acp-m']||0, s=+c['acp-s']||0, ms=+c['acp-ms']||100;
  const t = h*3600000+m*60000+s*1000+ms;
  const b=c['acp-button']||'left', ct=c['acp-click-type']||'single';
  return `${b} ${ct==='double'?'dbl':ct==='triple'?'3×':'1×'} · ${t<1000?t+'ms':(t/1000).toFixed(1)+'s'}`;
}

function buildMacro(c) {
  const h=+c['acp-h']||0, m=+c['acp-m']||0, s=+c['acp-s']||0, ms=+c['acp-ms']||100;
  const iv = Math.max(0.001, h*3600+m*60+s+ms/1000);
  const rand = c['acp-rand-offset']===true||c['acp-rand-offset']==='true';
  const rm = (+c['acp-rand-ms']||40)/1000;
  const btn=c['acp-button']||'left', ct=c['acp-click-type']||'single';
  const rmode=c['acp-repeat-mode']||'until_stopped', rct=+c['acp-repeat-count']||1;
  const pos=c['acp-pos-mode']||'current';
  const xy=pos!=='current'?{x:+c['acp-x']||0,y:+c['acp-y']||0}:{};
  const wait=rand?{type:'random_wait',min:Math.max(0.001,iv-rm),max:iv+rm}:{type:'wait',duration:iv};
  const click=ct==='double'?{type:'mouse_double_click',button:btn,...xy}
    :ct==='triple'?{type:'mouse_click',button:btn,count:3,...xy}
    :{type:'mouse_click',button:btn,count:1,...xy};
  const acts=rmode==='count'?[{type:'repeat',count:Math.max(1,rct),actions:[click,wait]}]:[click,wait];
  return {name:'__auto_clicker__',loop:rmode!=='count',loop_delay:0,
    rules:[{enabled:true,label:'click',conditions:[],actions:acts}]};
}

function setAcpOn(on) {
  _acpOn = on;
  document.getElementById('acp-dot').classList.toggle('on', on);
  const btn = document.getElementById('acp-btn');
  if (on) {
    clearCd();
    btn.className = 's'; btn.innerHTML = R_STOP + ' Arrêter';
  } else {
    btn.className = ''; btn.innerHTML = R_PLAY + ' Démarrer';
  }
}

function clearCd() {
  if (_cdTimer) { clearInterval(_cdTimer); _cdTimer = null; }
  const cd  = document.getElementById('acp-cd');
  const btn = document.getElementById('acp-btn');
  cd.className = ''; cd.textContent = '';
  btn.className = ''; btn.innerHTML = R_PLAY + ' Démarrer';
}

async function loadAcpCfg() {
  try {
    const r = await window.overlay.getAcpConfig();
    if (r?.ok && r.config) {
      _acpCfg = r.config;
      document.getElementById('acp-info').textContent = acpSum(_acpCfg);
      document.getElementById('ahk-s').textContent = _acpCfg['acp-key-start']||'F6';
      document.getElementById('ahk-e').textContent = _acpCfg['acp-key-stop'] ||'F7';
    }
  } catch(_){}
}

async function acpToggle() {
  /* annuler le compte à rebours si en cours */
  if (_cdTimer) { clearCd(); return; }

  if (_acpOn) { window.overlay.acpStop(); setAcpOn(false); return; }

  await loadAcpCfg();
  if (!_acpCfg) { document.getElementById('acp-info').textContent = 'Config manquante'; return; }

  const delay = +(_acpCfg['acp-start-delay']) || 0;
  if (delay > 0) {
    let rem = delay;
    const cd  = document.getElementById('acp-cd');
    const btn = document.getElementById('acp-btn');
    cd.textContent = `Démarrage dans ${rem}s`; cd.className = 'on';
    btn.className = 'cancel'; btn.innerHTML = '✕ Annuler';

    _cdTimer = setInterval(() => {
      rem--;
      if (rem <= 0) {
        clearCd();
        window.overlay.acpStart(buildMacro(_acpCfg));
        setAcpOn(true);
      } else {
        cd.textContent = `Démarrage dans ${rem}s`;
      }
    }, 1000);
  } else {
    window.overlay.acpStart(buildMacro(_acpCfg));
    setAcpOn(true);
  }
}

/* ── shortcuts live update ── */
window.overlay.onShortcutsUpdated(d => {
  if (d.stop)  document.getElementById('k-stop').textContent  = d.stop;
  if (d.pause) document.getElementById('k-pause').textContent = d.pause;
});

/* ── init ── */
applyCol();
loadMacros();
loadShortcuts();
loadAcpCfg();
</script>
</body>
</html>
